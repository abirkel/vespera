---
name: Promote to latest
# Promotion is a REAL BUILD dispatch, not a re-tag. testing already builds every day
# (see build.yml); this workflow's job is deciding WHEN a genuinely new, separately
# built and signed `latest` is warranted, then dispatching build.yml with
# `stream: latest` to produce it. See the "Dispatch a latest build" step for why a
# rebuild was chosen over skopeo copy or rewriting the version label in place.
on:
  # After every completed build.yml run. Gated below on conclusion == success, so a
  # failed or skipped build never reaches the content check.
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
  # Weekly floor: even if nothing ever triggers the workflow_run path (e.g. a long
  # run of schedule-only builds with no push), latest is still checked once a week.
  # Tuesday, not Saturday/weekend - a fresh promotion lands mid-week rather than right
  # before it, so any regression has weekday attention available, not a weekend gap.
  # Off the exact hour for the same reason build.yml's own cron is: GitHub's scheduler
  # is most congested at :00. 06:30 UTC = 3:30pm JST Tuesday (author's local time).
  schedule:
    - cron: '30 6 * * 2'
  # Explicit "promote now" escape hatch, matching Bluefin's own documented behaviour
  # ("most images are published weekly, but we may push a new update at any given
  # time"). force=true skips the content gate entirely.
  workflow_dispatch:
    inputs:
      force:
        description: "Promote even if the content gate finds nothing headline-worthy"
        type: boolean
        default: false

env:
  IMAGE_NAME: vespera
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  ARTIFACT_TYPE: application/vnd.vespera.packages.v1+json
  # testing: builds land here on every push/schedule/dispatch (see build.yml).
  # latest: what installed machines track; only this workflow ever moves it.
  SOURCE_TAG: testing
  TARGET_TAG: latest

concurrency:
  group: promote-${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    name: Promote testing to latest
    runs-on: ubuntu-24.04
    # Three ways in. workflow_run must have actually succeeded, and specifically from a
    # push/schedule/workflow_dispatch build, never a pull_request build - PR builds
    # never publish anything (build.yml gates every push/sign/attach step on
    # event_name != pull_request), so there is nothing new for the gate to compare.
    # Without this, three build.yml runs completing close together (a real push plus
    # two pull_request runs Renovate's own automation re-triggered) fire three
    # promote.yml runs, and the pull_request ones fail outright since :testing's
    # manifest was never touched by them. The other two triggers (schedule,
    # workflow_dispatch) are unconditional by nature.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event != 'pull_request')
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - name: Check for an in-flight build
        id: inflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Guards schedule and workflow_dispatch specifically: a workflow_run trigger is
        # already safe by construction (it only fires once build.yml has fully
        # completed), but schedule/dispatch have no such guarantee and can land while a
        # push build is still writing a new :testing digest. Confirmed live: a
        # workflow_dispatch test here raced an in-progress build.yml push run and
        # failed to find the manifest, because the digest it read was mid-publish, not
        # a registry propagation delay. Skipping cleanly here is correct - the next
        # workflow_run (when that build finishes) or the weekly schedule will re-check.
        #
        # SCOPED to push/schedule/workflow_dispatch runs only — a pull_request build.yml
        # run can NEVER publish (every push/sign/attach step there is gated on
        # event_name != pull_request), so it can never actually be "mid-publish" and
        # must never count as in-flight. Confirmed live 2026-09-18: an orphaned PR-check
        # build for an already-merged PR sat in_progress for 30+ minutes (GitHub never
        # auto-cancels it — build.yml's concurrency group is keyed on github.ref, and a
        # PR's pull_request ref never collides with the merge push's main ref), which
        # made this guard skip the one promote run that should have caught a real
        # kernel bump. Unscoped --workflow=build.yml counted that orphan as blocking
        # every single time, with no retry ever coming since a run that never completes
        # never fires promote.yml's own workflow_run trigger again.
        run: |
          set -euo pipefail
          COUNT="$(gh run list --repo "${{ github.repository }}" --workflow=build.yml \
            --event=push --event=schedule --event=workflow_dispatch \
            --status=in_progress --json databaseId --jq 'length')"
          COUNT_Q="$(gh run list --repo "${{ github.repository }}" --workflow=build.yml \
            --event=push --event=schedule --event=workflow_dispatch \
            --status=queued --json databaseId --jq 'length')"
          TOTAL=$(( COUNT + COUNT_Q ))
          echo "in-flight build.yml runs: ${TOTAL}"
          if [[ "${TOTAL}" -gt 0 ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            MSG="build.yml has ${TOTAL} run(s) in progress; skipping this check to avoid"
            MSG="${MSG} reading a mid-publish :${{ env.SOURCE_TAG }}. It will be"
            MSG="${MSG} re-evaluated on that build's completion or the next schedule."
            echo "::notice title=Skipping (build in flight)::${MSG}"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR (podman/skopeo)
        if: steps.inflight.outputs.skip != 'true'
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        if: steps.inflight.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR (oras)
        if: steps.inflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # oras keeps its own credential store, separate from the podman-login step
          # above (same gotcha build.yml's "Attach package manifest" step documents).
          printf '%s' "${GH_TOKEN}" \
            | oras login "${IMAGE_REGISTRY%%/*}" -u "${ACTOR}" --password-stdin

      # The content gate. Compares the package manifest already attached to :testing
      # against the one attached to :latest — the same OCI referrer build.yml's
      # "Attach package manifest" step writes on every publish, so this needs no new
      # data, no image pull, and no rebuild.
      #
      # HEADLINE PACKAGES ONLY, deliberately excluding the base image label. Kinoite's
      # base image is rebuilt by ublue nearly every day, and build.yml's own no-op
      # gate already showed that a same-content rebuild still moves the base's
      # ostree.commit/version daily even when nothing it ships actually changed. If
      # that label move alone triggered an early promotion, this gate would promote
      # almost every day - exactly the client-side update churn the weekly-by-default
      # promotion cadence exists to avoid. A pure base rebuild (or base rebuild plus
      # only leaf-package movement) is left for the weekly schedule to pick up; only a
      # change to a HEADLINE package - the ones with real day-to-day desktop impact -
      # is worth promoting early for.
      #
      # HEADLINE set matches .github/changelog.py's HEADLINE_PKGS exactly (kernel, KDE,
      # Mesa, Nvidia, Podman, Bootc, Flatpak, OSTree, RPM-OSTree). Anything outside that
      # set (a leaf library bump, or the base image moving with no headline-package
      # change) does not trigger a promotion on its own; the weekly schedule trigger is
      # what eventually picks those up in aggregate.
      - name: Compare testing against latest
        id: gate
        if: steps.inflight.outputs.skip != 'true'
        run: |
          set -euo pipefail

          fetch_manifest_json() {
            local tag="$1" digest artifact_digest workdir attempt
            # Modest retry only, as defense against a genuine transient blip. NOT sized
            # for a real propagation delay: three straight failures here turned out to
            # be a jq filter bug (oras 1.3.x's `discover --format json` nests referrers
            # under `.referrers`, not the older `.manifests` this originally assumed),
            # not the registry, so retrying longer was never going to help. Fixed to
            # accept either key. Kept short (4x10s=40s) on purpose now that the actual
            # cause is fixed - a long retry here was hiding a real bug behind a
            # plausible-sounding "eventual consistency" story for three runs in a row.
            for attempt in 1 2 3 4; do
              digest="$(skopeo inspect \
                  "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}" 2>/dev/null \
                | jq -r '.Digest // empty')"
              [[ -n "${digest}" ]] && break
              MSG="${tag}: digest not found yet (attempt ${attempt}/4), retrying in 10s"
              echo "::notice::${MSG}" >&2
              sleep 10
            done
            [[ -n "${digest}" ]] || { echo ""; return; }

            for attempt in 1 2 3 4; do
              artifact_digest="$(
                oras discover --format json "${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" \
                  | jq -r --arg t "${ARTIFACT_TYPE}" \
                      '(.referrers // .manifests // [])[]?
                       | select(.artifactType == $t) | .digest'
              )"
              artifact_digest="$(printf '%s\n' "${artifact_digest}" | head -1)"
              [[ -n "${artifact_digest}" ]] && break
              MSG="${tag}: manifest referrer not found yet (attempt ${attempt}/4), retrying in 10s"
              echo "::notice::${MSG}" >&2
              sleep 10
            done
            [[ -n "${artifact_digest}" ]] || { echo ""; return; }

            workdir="$(mktemp -d)"
            oras pull "${IMAGE_REGISTRY}/${IMAGE_NAME}@${artifact_digest}" \
              -o "${workdir}" >/dev/null
            find "${workdir}" -name '*.json' -print -quit
          }

          TESTING_JSON="$(fetch_manifest_json "${SOURCE_TAG}")"
          LATEST_JSON="$(fetch_manifest_json "${TARGET_TAG}")"

          if [[ -z "${TESTING_JSON}" ]]; then
            echo "unresolved=true" >>"$GITHUB_OUTPUT"
            echo "promote=false" >>"$GITHUB_OUTPUT"
            echo "reason=could not read :${SOURCE_TAG} manifest after retrying" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # No "first promotion, :latest doesn't exist yet" branch any more: that was
          # bootstrap-only logic, needed exactly once to get a real :latest built in
          # the first place (see 44.20260914.4, promoted 2026-09-14). Now that a real
          # latest-stream build exists and always will going forward, a missing or
          # unreadable :latest manifest here means something is actually wrong
          # (registry issue, manifest never attached, tag deleted) rather than an
          # expected first-run state - so it is treated the same as an unresolved
          # :testing read: a loud failure, not a silent "promote anyway".
          if [[ -z "${LATEST_JSON}" ]]; then
            echo "unresolved=true" >>"$GITHUB_OUTPUT"
            echo "promote=false" >>"$GITHUB_OUTPUT"
            echo "reason=could not read :${TARGET_TAG} manifest after retrying" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "${TESTING_JSON}" "${LATEST_JSON}" <<'PY' >>"$GITHUB_OUTPUT"
          import json, sys

          HEADLINE_PKGS = {
              "kernel-core", "plasma-desktop", "mesa-filesystem", "nvidia-driver",
              "podman", "bootc", "flatpak", "ostree", "rpm-ostree",
          }

          def load(path):
              with open(path) as f:
                  return json.load(f)

          testing, latest = load(sys.argv[1]), load(sys.argv[2])

          def versions(doc):
              out = {}
              for art in doc.get("artifacts", []):
                  if art.get("type") == "rpm" and art.get("name"):
                      out[art["name"]] = art.get("version")
              return out

          tv, lv = versions(testing), versions(latest)
          changed_headline = sorted(
              n for n in HEADLINE_PKGS
              if tv.get(n) != lv.get(n)
          )

          # Base image identity is intentionally NOT checked here - see the step
          # comment above. It moves almost daily on its own and would otherwise
          # promote almost every day, defeating the point of a weekly-by-default cadence.
          if changed_headline:
              print("promote=true")
              print("reason=headline packages changed: " + ", ".join(changed_headline))
          else:
              print("promote=false")
              print("reason=no headline package change since last promotion")
          PY

      - name: Report gate result
        if: steps.inflight.outputs.skip != 'true'
        run: |
          echo "::notice title=Content gate::${{ steps.gate.outputs.reason }}"

      # Distinct from "checked, nothing to promote": this is "could not check at all".
      # Both currently land on promote=false, which would otherwise make a registry
      # outage indistinguishable from a quiet week - every run goes green either way,
      # and a real, ongoing failure to promote would have no visible signal at all.
      # This step turns that specific case into an actual failed run (red X), while
      # still letting the workflow finish normally: the next workflow_run or the
      # weekly schedule gets a fresh attempt regardless of whether this step fails.
      - name: Fail loudly if the gate could not resolve
        if: steps.inflight.outputs.skip != 'true' && steps.gate.outputs.unresolved == 'true'
        run: |
          MSG="${{ steps.gate.outputs.reason }}."
          MSG="${MSG} This run is marked failed so a persistent registry problem is"
          MSG="${MSG} visible instead of silently looking like 'nothing to promote'."
          MSG="${MSG} A later workflow_run or the weekly schedule will retry"
          MSG="${MSG} automatically; no action needed unless this keeps happening."
          echo "::error::${MSG}"
          exit 1

      # force=true (workflow_dispatch only) bypasses the gate entirely — the explicit
      # "promote now" escape hatch. Every other trigger respects the gate's verdict.
      - name: Decide whether to promote
        id: decide
        if: steps.inflight.outputs.skip != 'true'
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GATE_PROMOTE: ${{ steps.gate.outputs.promote }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            echo "do_promote=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Promoting::forced via workflow_dispatch (force=true)."
          elif [[ "${GATE_PROMOTE}" == "true" ]]; then
            echo "do_promote=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Promoting::content gate found a qualifying change."
          else
            echo "do_promote=false" >>"$GITHUB_OUTPUT"
            MSG="content gate found nothing headline-worthy; ${TARGET_TAG} unchanged."
            echo "::notice title=Skipping::${MSG}"
          fi

      # Promotion is now a REAL BUILD, not a re-tag. skopeo copy would leave `latest`
      # carrying the same testing-<major>.<date>.<n> org.opencontainers.image.version
      # label the source build had — technically fine for bootc/rpm-ostree, but
      # confusing on a release build (`rpm-ostree status` on a machine tracking
      # `latest` would show "Version: testing-..." forever). Dispatching build.yml
      # with `stream: latest` gets `latest` its own genuine build, sign and attest
      # cycle from the SAME commit, with its own bare (unprefixed) version label -
      # the tradeoff being real build time and cost instead of an instant re-tag,
      # which is the explicit choice made here over re-tagging or rewriting the label
      # in place.
      - name: Dispatch a latest build
        id: dispatch
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Record "now" before dispatching so the polling step below can find the
          # exact run this triggered, rather than accidentally picking up some other
          # concurrent build.yml run by mistake.
          BEFORE="$(date -u +%s)"
          echo "before=${BEFORE}" >>"$GITHUB_OUTPUT"
          gh workflow run build.yml --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch || 'main' }}" \
            -f stream=latest
          echo "::notice title=Dispatched::build.yml -f stream=latest"

      # workflow_dispatch gives no run ID back directly, so find the run it created by
      # polling the list for a workflow_dispatch build.yml run newer than the moment
      # this job dispatched it. A short settle delay first: the run does not always
      # appear in the list instantly.
      - name: Find the dispatched run
        id: find_run
        if: steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFTER: ${{ steps.dispatch.outputs.before }}
        run: |
          set -euo pipefail
          sleep 15
          for attempt in $(seq 1 10); do
            RUN_ID="$(gh run list --repo "${{ github.repository }}" --workflow=build.yml \
              --event=workflow_dispatch --limit 5 \
              --json databaseId,createdAt,status \
              --jq "[.[] | select((.createdAt | fromdateiso8601) >= ${AFTER})]
                    | sort_by(.createdAt) | .[0].databaseId // empty")"
            [[ -n "${RUN_ID}" ]] && break
            echo "dispatched run not visible yet (attempt ${attempt}/10), retrying in 10s"
            sleep 10
          done
          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::could not find the dispatched build.yml run after retrying."
            exit 1
          fi
          echo "run_id=${RUN_ID}" >>"$GITHUB_OUTPUT"
          echo "::notice title=Found run::build.yml run ${RUN_ID}"

      # A real build, ~20-30 minutes based on this pipeline's own build.yml history.
      # gh run watch blocks until it finishes and exits non-zero if it failed, so a
      # failed latest build fails this job loudly rather than silently leaving latest
      # stale with no visible signal.
      - name: Wait for the latest build to finish
        id: wait
        if: steps.find_run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run watch "${{ steps.find_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" --exit-status
          # build.yml's own "version" job output isn't surfaced by `gh run view` in a
          # convenient form, so read it back off :latest, which the build just
          # published, instead.
          PROMOTED_VERSION="$(skopeo inspect \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${TARGET_TAG}" \
            | jq -r '.Labels["org.opencontainers.image.version"] // empty')"
          [[ -n "${PROMOTED_VERSION}" ]] || {
            echo "::error::latest build finished but :${TARGET_TAG} has no version label." >&2
            exit 1
          }
          echo "version=${PROMOTED_VERSION}" >>"$GITHUB_OUTPUT"
          echo "::notice title=Promoted::latest is now ${PROMOTED_VERSION}"

      # No separate release for latest: it IS the release. build.yml's own release
      # job already generates the full changelog (headline packages, package diff,
      # commits) for this bare, unprefixed version the moment it publishes — nothing
      # further to create or annotate here. Unlike the abandoned re-tag design, the
      # latest build genuinely is separate content this time (its own build, at
      # whatever point in time this workflow happened to run), so it deserves its own
      # real release rather than an annotation bolted onto testing's.
      - name: Report the promotion
        if: steps.wait.outputs.version != ''
        run: |
          MSG="latest ${{ steps.wait.outputs.version }} is live, with its own"
          MSG="${MSG} GitHub Release from build.yml's release job."
          echo "::notice title=Done::${MSG}"
