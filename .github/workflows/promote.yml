---
name: Promote to latest
# Promotion is a RETAG + RELABEL of testing's already-built, already-verified image —
# not a rebuild, and not a plain `skopeo copy` either. testing already builds every day
# (see build.yml); this workflow's job is deciding WHEN a promotion is warranted, then
# pulling that exact digest, rewriting its version label (buildah config --label, no
# recompile), and re-pushing/signing/attaching/releasing under :latest. See the
# "Relabel for latest" step for exactly what changes and what does not.
on:
  # Dispatched DIRECTLY by build.yml's own "Dispatch promote check" step, immediately
  # after a build that actually published to :testing (changed == 'true', not a
  # pull_request build, on the default branch) — see that step for the exact gate.
  # Also dispatchable manually (see the `force` input below).
  #
  # NOT a workflow_run trigger on every build.yml completion, on purpose. That was the
  # original design and it fired this workflow unconditionally for every PR-check
  # build, every no-op schedule run, everything — most of which then had nothing to
  # promote and just cluttered the Actions log figuring that out via this workflow's
  # own in-flight/content gates. Confirmed live 2026-09-18: a single Renovate pass
  # that opened/rebased four PRs at once produced two visible "Promote to latest"
  # runs, both skipped, for builds that could never have qualified (PR-check builds).
  # Gating the DISPATCH on "did this build actually publish" moves that filtering to
  # the one place that already knows the answer for free (build.yml's own `changed`
  # output), instead of re-deriving it here after the fact on every single completion.
  #
  # Weekly floor below: even if nothing ever triggers the dispatch path (e.g. a long
  # run of schedule-only builds that never publish a package change), latest is still
  # checked once a week regardless. Tuesday, not Saturday/weekend - a fresh promotion
  # lands mid-week rather than right before it, so any regression has weekday
  # attention available, not a weekend gap. Off the exact hour for the same reason
  # build.yml's own cron is: GitHub's scheduler is most congested at :00. 06:30 UTC =
  # 3:30pm JST Tuesday (author's local time).
  schedule:
    - cron: '30 6 * * 2'
  # Explicit "promote now" escape hatch, matching Bluefin's own documented behaviour
  # ("most images are published weekly, but we may push a new update at any given
  # time"). force=true skips the content gate entirely. build.yml's automatic dispatch
  # never sets force — only a human running this by hand would.
  workflow_dispatch:
    inputs:
      force:
        description: "Promote even if the content gate finds nothing headline-worthy"
        type: boolean
        default: false

env:
  IMAGE_NAME: vespera
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  ARTIFACT_TYPE: application/vnd.vespera.packages.v1+json
  # testing: builds land here on every push/schedule/dispatch (see build.yml).
  # latest: what installed machines track; only this workflow ever moves it.
  SOURCE_TAG: testing
  TARGET_TAG: latest

concurrency:
  group: promote-${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    name: Promote testing to latest
    runs-on: ubuntu-24.04
    # No job-level event-source guard needed any more: both triggers left on this
    # workflow (schedule, workflow_dispatch) are unconditionally safe to run — there
    # is no workflow_run trigger any more to filter a pull_request-sourced completion
    # out of (see the `on:` block above for why that trigger was removed).
    permissions:
      # write, not read: this job now creates the GitHub Release directly (ported
      # from build.yml's own release job, since there is no longer a dispatched
      # build.yml run to do it).
      contents: write
      actions: write
      packages: write
      id-token: write
      attestations: write
    steps:
      # Needed from here on: .github/scripts/*.sh and .github/changelog.py are called
      # by path throughout this job (the gate, the relabel steps, the release step),
      # and this workflow previously never checked out the repo at all — it only ever
      # dispatched build.yml, which does its own checkout. fetch-depth: 500 up front
      # (rather than a second, deeper checkout later just for the release step) is
      # what the release step's commit table needs; ublue uses 500 for the same
      # reason, and the default depth of 1 would make that section silently empty.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 500

      - name: Check for an in-flight build
        id: inflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Guards the schedule trigger specifically: a workflow_dispatch fired by
        # build.yml's own "Dispatch promote check" step is already safe by
        # construction (it only fires once that same build has fully finished
        # publishing), but the weekly schedule has no such guarantee and can land
        # while some OTHER build.yml run is still writing a new :testing digest.
        # Confirmed live: a workflow_dispatch test here once raced an in-progress
        # build.yml push run and failed to find the manifest, because the digest it
        # read was mid-publish, not a registry propagation delay. Skipping cleanly
        # here is correct — the next dispatch (once that build finishes) or the
        # weekly schedule will re-check.
        #
        # SCOPED to push/schedule/workflow_dispatch runs only — a pull_request build.yml
        # run can NEVER publish (every push/sign/attach step there is gated on
        # event_name != pull_request), so it can never actually be "mid-publish" and
        # must never count as in-flight. Confirmed live 2026-09-18: an orphaned PR-check
        # build for an already-merged PR sat in_progress for 30+ minutes (GitHub never
        # auto-cancels it — build.yml's concurrency group is keyed on github.ref, and a
        # PR's pull_request ref never collides with the merge push's main ref), which
        # made this guard skip the one promote run that should have caught a real
        # kernel bump. Unscoped --workflow=build.yml counted that orphan as blocking
        # every single time.
        run: |
          set -euo pipefail
          COUNT="$(gh run list --repo "${{ github.repository }}" --workflow=build.yml \
            --event=push --event=schedule --event=workflow_dispatch \
            --status=in_progress --json databaseId --jq 'length')"
          COUNT_Q="$(gh run list --repo "${{ github.repository }}" --workflow=build.yml \
            --event=push --event=schedule --event=workflow_dispatch \
            --status=queued --json databaseId --jq 'length')"
          TOTAL=$(( COUNT + COUNT_Q ))
          echo "in-flight build.yml runs: ${TOTAL}"
          if [[ "${TOTAL}" -gt 0 ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            MSG="build.yml has ${TOTAL} run(s) in progress; skipping this check to avoid"
            MSG="${MSG} reading a mid-publish :${{ env.SOURCE_TAG }}. It will be"
            MSG="${MSG} re-evaluated on that build's completion or the next schedule."
            echo "::notice title=Skipping (build in flight)::${MSG}"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR (podman/skopeo)
        if: steps.inflight.outputs.skip != 'true'
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        if: steps.inflight.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR (oras)
        if: steps.inflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # oras keeps its own credential store, separate from the podman-login step
          # above (same gotcha build.yml's "Attach package manifest" step documents).
          printf '%s' "${GH_TOKEN}" \
            | oras login "${IMAGE_REGISTRY%%/*}" -u "${ACTOR}" --password-stdin

      # The content gate. Compares the package manifest already attached to :testing
      # against the one attached to :latest — the same OCI referrer build.yml's
      # "Attach package manifest" step writes on every publish, so this needs no new
      # data, no image pull, and no rebuild.
      #
      # HEADLINE PACKAGES ONLY, deliberately excluding the base image label — see
      # .github/scripts/headline-check.py (SHARED with build.yml's own fast-path check;
      # this is the slow-path / safety-net copy, exercised by this workflow's own
      # schedule and workflow_dispatch triggers, which have no upstream build.yml
      # decision to rely on).
      - name: Compare testing against latest
        id: gate
        if: steps.inflight.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TESTING_MANIFEST="$(.github/scripts/fetch-manifest.sh \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}" "${SOURCE_TAG}")"
          LATEST_MANIFEST="$(.github/scripts/fetch-manifest.sh \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}" "${TARGET_TAG}")"

          if [[ -z "${TESTING_MANIFEST}" ]]; then
            echo "unresolved=true" >>"$GITHUB_OUTPUT"
            echo "promote=false" >>"$GITHUB_OUTPUT"
            echo "reason=could not read :${SOURCE_TAG} manifest after retrying" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # No "first promotion, :latest doesn't exist yet" branch any more: that was
          # bootstrap-only logic, needed exactly once to get a real :latest built in
          # the first place (see 44.20260914.4, promoted 2026-09-14). Now that a real
          # latest-stream build exists and always will going forward, a missing or
          # unreadable :latest manifest here means something is actually wrong
          # (registry issue, manifest never attached, tag deleted) rather than an
          # expected first-run state - so it is treated the same as an unresolved
          # :testing read: a loud failure, not a silent "promote anyway".
          if [[ -z "${LATEST_MANIFEST}" ]]; then
            echo "unresolved=true" >>"$GITHUB_OUTPUT"
            echo "promote=false" >>"$GITHUB_OUTPUT"
            echo "reason=could not read :${TARGET_TAG} manifest after retrying" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          python3 .github/scripts/headline-check.py \
            "${TESTING_MANIFEST}" "${LATEST_MANIFEST}" >>"$GITHUB_OUTPUT"

      - name: Report gate result
        if: steps.inflight.outputs.skip != 'true'
        run: |
          echo "::notice title=Content gate::${{ steps.gate.outputs.reason }}"

      # Distinct from "checked, nothing to promote": this is "could not check at all".
      # Both currently land on promote=false, which would otherwise make a registry
      # outage indistinguishable from a quiet week - every run goes green either way,
      # and a real, ongoing failure to promote would have no visible signal at all.
      # This step turns that specific case into an actual failed run (red X), while
      # still letting the workflow finish normally: the next workflow_run or the
      # weekly schedule gets a fresh attempt regardless of whether this step fails.
      - name: Fail loudly if the gate could not resolve
        if: steps.inflight.outputs.skip != 'true' && steps.gate.outputs.unresolved == 'true'
        run: |
          MSG="${{ steps.gate.outputs.reason }}."
          MSG="${MSG} This run is marked failed so a persistent registry problem is"
          MSG="${MSG} visible instead of silently looking like 'nothing to promote'."
          MSG="${MSG} A later workflow_run or the weekly schedule will retry"
          MSG="${MSG} automatically; no action needed unless this keeps happening."
          echo "::error::${MSG}"
          exit 1

      # force=true (workflow_dispatch only) bypasses the gate entirely — the explicit
      # "promote now" escape hatch. Every other trigger respects the gate's verdict.
      - name: Decide whether to promote
        id: decide
        if: steps.inflight.outputs.skip != 'true'
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GATE_PROMOTE: ${{ steps.gate.outputs.promote }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            echo "do_promote=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Promoting::forced via workflow_dispatch (force=true)."
          elif [[ "${GATE_PROMOTE}" == "true" ]]; then
            echo "do_promote=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Promoting::content gate found a qualifying change."
          else
            echo "do_promote=false" >>"$GITHUB_OUTPUT"
            MSG="content gate found nothing headline-worthy; ${TARGET_TAG} unchanged."
            echo "::notice title=Skipping::${MSG}"
          fi

      # Promotion is a RETAG + RELABEL of the already-built, already-verified :testing
      # image, not a second build. It USED TO dispatch build.yml with `stream: latest`
      # to produce a genuinely separate build — confirmed live 2026-09-19 that this
      # second build reproduced byte-identical package content (same
      # dev.vespera.pkg-fingerprint label) to the testing build moments earlier, at the
      # cost of a full ~20-30 minute rebuild purely to get a different version label
      # onto otherwise-identical content. The only thing a rebuild bought over a plain
      # `skopeo copy` was an honest, unprefixed org.opencontainers.image.version label
      # (skopeo copy would leave `latest` carrying `testing-44.20260919.1` forever,
      # confusing on a release build) — buildah can rewrite that ONE label in place,
      # with no recompile, which is what this step now does.
      - name: Compute latest version
        id: latest_version
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        run: |
          set -euo pipefail
          # Same numbering scheme as build.yml's own "Compute version" step, but scoped
          # to the bare (unprefixed) tag space latest/44.YYYYMMDD[.N] uses — a latest
          # build must only ever look at bare tags, never testing-* ones, or the two
          # streams' independent day-counters would collide.
          FEDORA_MAJOR="$(skopeo inspect "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${SOURCE_TAG}" \
            | jq -r '.Labels["org.opencontainers.image.version"]' | cut -d. -f1)"
          DATE="$(date -u +%Y%m%d)"
          PREFIX="${FEDORA_MAJOR}.${DATE}"
          TAGS_JSON="$(skopeo list-tags "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}" \
                       2>/dev/null || echo '{"Tags":[]}')"
          BARE_EXISTS="$(jq -r --arg p "${PREFIX}" '.Tags[]? | select(. == $p)' <<<"${TAGS_JSON}")"
          HIGHEST="$(jq -r --arg p "${PREFIX}." \
                       '.Tags[]? | select(startswith($p)) | ltrimstr($p)' <<<"${TAGS_JSON}" \
                     | grep -xE '[0-9]+' | sort -n | tail -1 || true)"
          if [[ -z "${BARE_EXISTS}" && -z "${HIGHEST}" ]]; then
            VERSION="${PREFIX}"
          else
            VERSION="${PREFIX}.$(( ${HIGHEST:-0} + 1 ))"
          fi
          echo "fedora_major=${FEDORA_MAJOR}" >>"$GITHUB_OUTPUT"
          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          echo "::notice title=Version::promoting as ${VERSION}"

      # Pull testing's exact digest (not the moving tag — a push could land on
      # :testing between the gate's read and here) into local storage, no compose.
      - name: Pull testing image
        id: pull
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        run: |
          set -euo pipefail
          DIGEST="$(skopeo inspect "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${SOURCE_TAG}" \
            | jq -r '.Digest')"
          echo "digest=${DIGEST}" >>"$GITHUB_OUTPUT"
          buildah pull "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          echo "::notice title=Pulled::${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Rewrite ONLY the version label. Everything else — the package set, the
      # dev.vespera.pkg-fingerprint label, containers.bootc, revision — is already
      # correct and already verified (the gate above just re-confirmed it). No other
      # buildah-build step, no dnf, no rechunk: the filesystem layers are untouched.
      - name: Relabel for latest
        id: relabel
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        env:
          VERSION: ${{ steps.latest_version.outputs.version }}
        run: |
          set -euo pipefail
          CTR="$(buildah from "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.pull.outputs.digest }}")"
          buildah config --label "org.opencontainers.image.version=${VERSION}" "${CTR}"
          NEW_IMAGE_ID="$(buildah commit --format oci "${CTR}" \
            "localhost/${IMAGE_NAME}:latest-promoting")"
          buildah rm "${CTR}" >/dev/null
          echo "image_id=${NEW_IMAGE_ID}" >>"$GITHUB_OUTPUT"

      - name: Tag for push
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        env:
          VERSION: ${{ steps.latest_version.outputs.version }}
          FEDORA_MAJOR: ${{ steps.latest_version.outputs.fedora_major }}
        run: |
          set -euo pipefail
          for t in "${TARGET_TAG}" "${VERSION}" "${FEDORA_MAJOR}"; do
            podman tag "${{ steps.relabel.outputs.image_id }}" "localhost/${IMAGE_NAME}:${t}"
          done

      - name: Log in to GHCR (push)
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push relabeled image
        id: push
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: >-
            ${{ env.TARGET_TAG }} ${{ steps.latest_version.outputs.version }}
            ${{ steps.latest_version.outputs.fedora_major }}
          registry: ${{ env.IMAGE_REGISTRY }}

      # Re-signing is unavoidable regardless of retag-vs-rebuild: the signature is over
      # the digest, and rewriting even one label changes the digest. Same mechanics
      # build.yml's own "Sign image" step uses.
      - name: Install cosign
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign relabeled image
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Re-attach the SAME manifest JSON testing's build already verified — the
      # package set has not changed, only the label, so there is nothing new to
      # regenerate here.
      - name: Attach package manifest
        id: attach
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        run: |
          set -euo pipefail
          TESTING_MANIFEST="$(.github/scripts/fetch-manifest.sh \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}" "${SOURCE_TAG}")"
          [[ -n "${TESTING_MANIFEST}" ]] || {
            echo "::error::could not re-fetch :${SOURCE_TAG}'s manifest to re-attach to :${TARGET_TAG}." >&2
            exit 1
          }
          oras attach \
            --artifact-type "${ARTIFACT_TYPE}" \
            --annotation filename=packages.json \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}" \
            "${TESTING_MANIFEST}:application/json"
          echo "::notice title=Promoted::latest is now ${{ steps.latest_version.outputs.version }}"

      # Same provenance attestation build.yml's own build attaches to every real
      # publish — ported here since this job now IS the publish for :latest, rather
      # than assuming build.yml's does when it no longer runs for this stream.
      - name: Attest provenance
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # Same reasoning as build.yml's identical step: MUST stay false, or the
          # keyless sigstore bundle this pushes into the registry's OCI referrers
          # fallback index breaks `cosign verify --key` against the real signature.
          push-to-registry: false

      # No dispatched build.yml run any more to generate the release, so this job does
      # it directly — same script (.github/changelog.py), same inputs, just called here
      # instead of from build.yml's own release job. The checkout at the top of this
      # job already has the fetch-depth: 500 this needs for the commit table.
      - name: Generate release notes
        id: notes
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ steps.latest_version.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/changelog.py "${VERSION}" ./output.env ./changelog.md --workdir .
          source ./output.env
          echo "title=${TITLE}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"

      - name: Create release
        if: steps.inflight.outputs.skip != 'true' && steps.decide.outputs.do_promote == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ steps.notes.outputs.title }}
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ./changelog.md
          # A real latest-stream promotion always claims the "Latest release" badge —
          # unconditionally true here, unlike build.yml's own conditional version of
          # this same setting, because this job ONLY ever runs when do_promote is true.
          make_latest: true
