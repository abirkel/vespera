---
name: Build image
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']
  schedule:
    # ~07:00 UTC daily. The base image is rebuilt daily by ublue, and Renovate bumps the
    # digest pin, but a scheduled build also picks up new Fedora updates in the layers
    # added on top.
    #
    # NOT EARLIER: 30-kmods.sh treats a missing kmod-yeetmouse as fatal, and the kmod for
    # a newly bumped kernel only exists once abirkel/yeetmouse-rpm has built it — its
    # check-release workflow runs ~06:00 UTC and takes a few minutes, including the
    # downstream sign-and-publish in abirkel/rpm-repo and the Pages deploy. This used to
    # be 05:20, i.e. 40 minutes BEFORE the kmod it depends on could exist, which would
    # have failed every build on a kernel-bump day.
    #
    # OFF THE EXACT HOUR ON PURPOSE: GitHub's Actions scheduler is most congested at
    # :00, and check-release's own '0 6 * * *' cron was observed drifting hours late
    # from 2026-08-27 onward (09:54-18:09 UTC instead of ~06:30). Moving both crons off
    # the hour doesn't guarantee on-time firing, but avoids the worst-contended slot.
    - cron: '14 7 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: vespera
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_DESC: "Fedora Kinoite with NVIDIA, gaming and light development tooling"
  DEFAULT_TAG: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The image is large; the runner needs the space back.
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@25e05be4948f77746938687877829d15c5038036
        continue-on-error: true
        with:
          mount-opts: compress-force=zstd:2

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Needed so the "Decide whether the image changed" step can git diff a push
          # event's before..after range to see which files actually changed. 2 is enough
          # for a normal single-commit push; Renovate PRs sometimes land as a 1-commit
          # squash merge too. If a push carries more commits than this, the diff command
          # below still fails safely open (treated as "unknown", always publishes) rather
          # than silently comparing the wrong range.
          fetch-depth: 50

      # `just` is the only tool this workflow needs that the runner image lacks.
      # Verified against the ubuntu-24.04 manifest: Podman 5.8.4, Buildah 1.33.7,
      # Skopeo 1.13.3, jq, shellcheck, Node, Python and yamllint are all preinstalled —
      # so `just rechunk` (podman + skopeo + jq) and `just check` need nothing added.
      # An earlier version also apt-installed skopeo, which was redundant.
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Check just syntax
        run: just check

      # Version: <fedora-major>.<date>.<run attempt>, e.g. 44.20260828.1
      #
      # Read from the BASE IMAGE's own label rather than grepped from the
      # Containerfile, which no longer holds a version number now that BASE_TAG is
      # `latest`. The published tag is then always the release actually built
      # against, including the day ublue promotes `latest` to Fedora 45.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          BASE="$(grep -oP '^ARG BASE_IMAGE="\K[^"]+' Containerfile)"
          TAG="$(grep -oP '^ARG BASE_TAG="\K[^"]+' Containerfile)"
          if [[ "${TAG}" == *@* ]]; then REF="${BASE}@${TAG#*@}"; else REF="${BASE}:${TAG}"; fi
          BASE_VERSION="$(skopeo inspect "docker://${REF}" \
            | jq -r '.Labels["org.opencontainers.image.version"] // empty')"
          FEDORA_MAJOR="${BASE_VERSION%%.*}"
          if [[ ! "${FEDORA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "could not determine Fedora major from base label '${BASE_VERSION}'" >&2
            exit 1
          fi
          # The dated tag is the anchor the changelog diffs against, so it MUST be unique.
          # github.run_attempt is 1 for every NEW run and only increments when the same run
          # is retried, so two publishes on one day (a push plus the 07:00 schedule) both
          # produced .1 and the second silently overwrote the first, destroying the older
          # image the changelog needs to compare against. Take the next free index for
          # today from the registry instead. Bazzite solves the same problem with a
          # "relabel" step that suffixes .1, .2 on collision.
          DATE="$(date -u +%Y%m%d)"
          PREFIX="${FEDORA_MAJOR}.${DATE}"
          HIGHEST="$(skopeo list-tags "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}" 2>/dev/null \
                     | jq -r --arg p "${PREFIX}." \
                         '.Tags[]? | select(startswith($p)) | ltrimstr($p)' \
                     | grep -xE '[0-9]+' | sort -n | tail -1 || true)"
          VERSION="${PREFIX}.$(( ${HIGHEST:-0} + 1 ))"
          echo "fedora_major=${FEDORA_MAJOR}" >>"$GITHUB_OUTPUT"
          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          echo "Base ${REF} is Fedora ${FEDORA_MAJOR}; building version ${VERSION}"

      - name: Compute tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.version.outputs.version }}
          FEDORA_MAJOR: ${{ steps.version.outputs.fedora_major }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          # buildah-build takes a space-separated list.
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            TAGS="pr-${PR_NUMBER}"
          elif [[ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            # A NON-DEFAULT ref publishes under its branch name and nothing else.
            # `latest` must only ever come from the default branch: installed machines
            # follow that tag, and on this fleet uupd applies it automatically, so a
            # trial build reaching `latest` would rebase real hardware unattended.
            # Sanitised because a Docker tag allows only [A-Za-z0-9._-], max 128 chars,
            # and must not start with . or - (branch names like renovate/foo would
            # otherwise produce an invalid tag).
            TAGS="$(printf '%s' "${REF_NAME}" \
                    | tr -c 'a-zA-Z0-9._-' '-' \
                    | sed 's/^[.-]*//' \
                    | cut -c1-64)"
            [[ -n "${TAGS}" ]] || { echo "branch name sanitised to nothing" >&2; exit 1; }
          else
            TAGS="${DEFAULT_TAG} ${VERSION} ${FEDORA_MAJOR}"
          fi
          echo "tags=${TAGS}" >>"$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      # Verify the base image's signature before building on it.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # BOTH pins matter, and they are a matched pair — the same combination ublue's
          # image-template uses.
          #
          # cosign v3.1.2, because the installer's own default is v2.5.3, which has no
          # --new-bundle-format flag at all (the sign step died on "unknown flag" after a
          # full 50-minute build).
          #
          # Installer v4.1.2, because v3.9.2 verifies the requested binary against a
          # detached cosign-linux-amd64.sig, and cosign 3.x releases no longer publish one
          # — curl exits 22 on the 404, so v3.9.2 simply cannot install any cosign 3.x.
          cosign-release: v3.1.3

      - name: Verify upstream image signatures
        run: |
          set -euo pipefail
          verify_arg() {
            local image_arg="$1" tag_arg="$2" image tag ref
            image="$(grep -oP "^ARG ${image_arg}=\"\\K[^\"]+" Containerfile)"
            tag="$(grep -oP "^ARG ${tag_arg}=\"\\K[^\"]+" Containerfile)"
            # pinDigests writes the digest into the tag ARG, giving "latest@sha256:...".
            # Verify by digest alone then: a ref carrying both a tag and a digest is not
            # universally accepted.
            if [[ "${tag}" == *@* ]]; then ref="${image}@${tag#*@}"; else ref="${image}:${tag}"; fi
            echo "Verifying ${ref}"
            cosign verify \
              --key https://raw.githubusercontent.com/ublue-os/main/main/cosign.pub \
              "${ref}"
          }

          verify_arg BASE_IMAGE BASE_TAG

          # akmods MUST be verified too, not just the base. Its RPMs are bind-mounted and
          # installed from /tmp/akmods-rpms, i.e. as @commandline, so dnf reports
          # "skipped OpenPGP checks" for them — the RPM headers are signed but nothing
          # checks them. That makes this image signature the only thing vouching for
          # kernel modules that then load into the running kernel. Verified that ublue
          # signs it with the same key as the base.
          verify_arg AKMODS_IMAGE AKMODS_TAG

      - name: Build image
        id: build
        # v3, and the version matters enormously for build time. v2.13 unconditionally
        # exported a storage mount_program of fuse-overlayfs, so every buildah and podman
        # write in this job went through userspace FUSE. Measured against the old
        # bazzite-based pipeline, which is already on v3: our COMMIT took 2380s versus 7s,
        # and `bootc container lint` 664s versus 9s — both being full-tree walks. v3.1.0
        # detects rootless native overlayfs (kernel 5.11+) and skips the override, logging
        # "Kernel supports rootless native overlayfs, skipping fuse-overlayfs override".
        # Its release notes cite both the performance regression and silent data corruption
        # on ubuntu-24.04 runners.
        #
        # v3.0.0 also changed `squash` to default true. Harmless here: buildah's --squash
        # only collapses the layers this build ADDS (base layers are untouched), this
        # Containerfile has just two RUNs, and the image is rechunked afterwards anyway.
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            IMAGE_VENDOR=${{ github.repository_owner }}
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            VERSION_TAG=${{ steps.version.outputs.version }}
          # image.revision is what makes the changelog's commit table possible: it turns a
          # pair of published images into `git log <prev-revision>..<curr-revision>`, the
          # same mechanism ublue uses. Without it that section is silently empty.
          # NOTE: no comments inside the block scalars below - every line there is passed
          # through verbatim as a literal label or build-arg.
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            containers.bootc=1
          oci: true

      # Surface soft failures (a missing yeetmouse kmod, say) even on success.
      - name: Report build warnings
        if: always()
        run: |
          echo "Check the '99-cleanup.sh' and 'BUILD COMPLETED WITH WARNINGS'"
          echo "sections of the build log above for soft failures."

      # Publish only when the image's CONTENT actually changed.
      #
      # ublue rebuilds the base daily, but the rebuild is frequently a no-op: across eight
      # consecutive kinoite-nvidia builds there were only five distinct rpmostree.inputhash
      # values, so 3 of 7 day-to-day transitions carried no package change at all. Their
      # digest and ostree.commit still move every day, so comparing those would never skip.
      #
      # Publishing a no-op is not free for the machines that track this tag: a new digest
      # makes bootc/uupd stage a fresh deployment and ask for a reboot to apply nothing.
      # So the gate is here, AFTER the build, comparing the real resolved package set of
      # the image just built against the one recorded on the published tag.
      #
      # One fingerprint covers both halves of the question — "did the base change?" and
      # "did any package we add change?" — because rpm -qa lists the base's kernel,
      # systemd and KDE alongside our wine, steam, Terra and COPR packages.
      #
      # Flatpaks are correctly absent from it: only preinstall.d DECLARATIONS ship in the
      # image, and the apps themselves are pulled on the desktop at first boot and updated
      # thereafter by flatpak-system-update.timer, so they can never churn the image.
      #
      # SCHEDULE AND PUSH, with an extra guard on push. A push can change file content
      # (system_files, hooks, kargs) without changing a single NEVRA, so a push that
      # touches anything other than Containerfile still always publishes. But the
      # overwhelming majority of pushes to main are Renovate automerges that touch
      # ONLY Containerfile's ARG lines (a digest bump), and those are exactly the source
      # of the config-only, zero-package "no changes" releases this gate exists to catch
      # in the first place — see 44.20260908.2 and 44.20260910.2 in the release history,
      # both "No package changes; this build differs only in configuration" despite being
      # push-triggered, which the old EVENT_NAME != schedule check let straight through.
      #
      # Blind spots, both accepted: the Microsoft core fonts are fetched .cab files
      # extracted with cabextract, so they carry no NEVRA at all, and cicpoffs comes from a
      # rolling `master` release whose asset is replaced in place, so its NEVRA can stay
      # cicpoffs-0.3-1.fc44 while the binary changes. Neither is touched by a
      # Containerfile-only digest bump, so this guard does not widen either blind spot.
      # A manual workflow_dispatch always publishes, as an explicit "ship it now" escape
      # hatch regardless of what the fingerprint says.
      - name: Decide whether the image changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          read -r -a tag_list <<<"${TAGS}"
          FIRST="${tag_list[0]}"

          # ONE container invocation serves both consumers: this gate needs a hash of the
          # package set, and the changelog needs the set itself. --entrypoint is required
          # because this image's CMD is /sbin/init.
          #
          # %{SOURCERPM} is the field that lets the changelog group subpackages EXACTLY -
          # kernel-modules and kernel-devel come from one source build - instead of
          # inferring it from matching version strings the way ublue's script does. Theirs
          # collapses on version alone, which on a real bazzite release silently hid five
          # genuine source-package updates, including one where an UNCHANGED package
          # (qt6-filesystem) suppressed a changed one (qt6-srpm-macros) that happened to
          # share its old version.
          podman run --rm --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${FIRST}" \
            -c 'rpm -qa --qf "%{NAME}\t%{EPOCH}\t%{VERSION}-%{RELEASE}\t%{SOURCERPM}\t%{NEVRA}\n"' \
            >pkgs.tsv
          echo "packages in image: $(wc -l <pkgs.tsv)"

          # Base image identity, for the changelog to report separately from our own
          # package churn — written by 80-image-info.sh from the base's own
          # OSTREE_VERSION, so this is the base's build date, not ours.
          BASE_INFO_JQ='"\(.["base-image-name"])\t\(.["ostree-version"])"'
          podman run --rm --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${FIRST}" \
            -c "jq -r '${BASE_INFO_JQ}' /usr/share/ublue-os/image-info.json" \
            >base.tsv
          BASE_IMAGE_NAME="$(cut -f1 base.tsv)"
          BASE_IMAGE_VERSION="$(cut -f2 base.tsv)"
          echo "base image: ${BASE_IMAGE_NAME} ${BASE_IMAGE_VERSION}"

          NEW="$(cut -f5 pkgs.tsv | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          echo "built image package fingerprint: ${NEW}"
          echo "fingerprint=${NEW}" >>"$GITHUB_OUTPUT"

          # A syft-json-compatible subset: syft names these fields identically, so the
          # ublue parsing helpers work on it unchanged.
          python3 - "${VERSION}" "${BASE_IMAGE_NAME}" "${BASE_IMAGE_VERSION}" >packages.json <<'PY'
          import json, sys
          arts = []
          for line in open("pkgs.tsv"):
              f = line.rstrip("\n").split("\t")
              if len(f) < 5:
                  continue
              name, epoch, vr, srpm = f[0], f[1], f[2], f[3]
              arts.append({
                  "name": name,
                  "version": vr if epoch in ("(none)", "") else f"{epoch}:{vr}",
                  "type": "rpm",
                  "metadata": {"sourceRpm": srpm},
              })
          arts.sort(key=lambda a: (a["name"], a["version"]))
          json.dump({"source": {"name": "vespera", "version": sys.argv[1],
                                 "base_image": sys.argv[2], "base_version": sys.argv[3]},
                     "artifacts": arts}, sys.stdout)
          PY
          echo "manifest bytes: $(stat -c%s packages.json)"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Publishing::manual dispatch - always publishes."
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "push" ]]; then
            # Only Containerfile may have changed for the fingerprint check to apply.
            # A push event's "before" SHA is the tip before this push, exactly what
            # changed. Checkout above fetches enough history for the normal case; if the
            # before SHA is still not present (deeper history than fetch-depth covers,
            # or a brand new branch with an all-zero before SHA), fail open to always
            # publishing rather than guessing.
            before_ok=0
            if [[ -n "${EVENT_BEFORE}" ]] \
               && [[ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]] \
               && git cat-file -e "${EVENT_BEFORE}" 2>/dev/null; then
              before_ok=1
            fi

            if [[ "${before_ok}" == "1" ]]; then
              CHANGED_FILES="$(git diff --name-only "${EVENT_BEFORE}" "${EVENT_SHA}")"
            else
              echo "::notice::before-commit not available for diff; treating as unknown."
              CHANGED_FILES=$'Containerfile\nunknown'
            fi
            OTHER_FILES="$(printf '%s\n' "${CHANGED_FILES}" \
              | grep -v '^Containerfile$' | grep -v '^$' || true)"
            if [[ -n "${OTHER_FILES}" ]]; then
              echo "changed=true" >>"$GITHUB_OUTPUT"
              MSG="push touches files besides Containerfile, always publishes:"
              MSG="${MSG} $(printf '%s' "${OTHER_FILES}" | tr '\n' ' ')"
              echo "::notice title=Publishing::${MSG}"
              exit 0
            fi
            echo "push touches only Containerfile (or nothing); checking fingerprint."
          fi

          # Compare against the currently published DEFAULT_TAG image either way: both a
          # schedule run and a Containerfile-only push are comparable to what is live.
          REF="docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          OLD="$(skopeo inspect "${REF}" 2>/dev/null \
                 | jq -r '.Labels["dev.vespera.pkg-fingerprint"] // ""' || true)"
          echo "published fingerprint: ${OLD:-<none>}"

          if [[ -z "${OLD}" ]]; then
            # Fail open: no published fingerprint yet, or rechunk failed last time and the
            # label never got attached. Publishing is the safe answer.
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Publishing::No fingerprint on the published image; cannot compare."
          elif [[ "${NEW}" != "${OLD}" ]]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Publishing::Package set changed since the published image."
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
            MSG="Package set identical to the published image; skipping rechunk, push"
            MSG="${MSG} and sign. Nothing for installed machines to download."
            echo "::notice title=No changes::${MSG}"
          fi

      # Rechunk before pushing so updates ship deltas, not the whole image.
      #
      # The single RUN puts every added package into ONE layer, which changes in its
      # entirety on any change. build-chunked-oci re-splits the flattened tree into
      # per-package content-addressed layers, so an update only downloads what moved.
      # Measured on comparable images: 40-80% less, >90% back-to-back. Same tool
      # Bazzite and ublue's image-template use, already in the base image.
      #
      # continue-on-error is deliberate: this is an optimisation, and a fat-but-correct
      # image beats blocking every update — the same trade as a lagging akmods. The
      # next step reports the outcome so it cannot rot unnoticed.
      - name: Rechunk image
        id: rechunk
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          # Stamped onto the image as a label by the rechunk recipe. It cannot be applied
          # at build time: buildah sets labels while building, but the fingerprint is only
          # knowable once the image exists. Rechunk rebuilds the config regardless.
          PKG_FINGERPRINT: ${{ steps.changed.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # TAGS is a deliberately space-separated list, so read it into an array once
          # rather than relying on repeated unquoted word splitting.
          read -r -a tag_list <<<"${TAGS}"
          FIRST="${tag_list[0]}"
          just rechunk "${FIRST}"
          # Re-point the other tags; otherwise they still reference the pre-rechunk
          # image and the push step publishes a mix.
          for t in "${tag_list[@]:1}"; do
            podman tag "localhost/${IMAGE_NAME}:${FIRST}" "localhost/${IMAGE_NAME}:${t}"
          done
          podman inspect "localhost/${IMAGE_NAME}:${FIRST}" \
            | jq -r '"final layer count: \(.[0].RootFS.Layers | length)"'

      - name: Report rechunk outcome
        if: always() && steps.changed.outputs.changed == 'true'
        run: |
          if [[ "${{ steps.rechunk.outcome }}" == "success" ]]; then
            echo "::notice title=Rechunk::Image rechunked; updates will download deltas."
          else
            msg="Publishing an un-rechunked image. It is correct, but every update"
            msg="${msg} will re-download the full package layer. See the Rechunk step log."
            echo "::warning title=Rechunk failed::${msg}"
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      # Legacy simple-signing mode: rpm-ostree and bootc still require that format,
      # hence the pinned cosign 3.x and the explicit --new-bundle-format=false.
      - name: Sign image
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Both flags force the OLD signature bundle format, which is the only one
          # containers/image and rpm-ostree can verify — so it is what makes the
          # sigstoreSigned rule in 85-signing.sh's policy.json actually work:
          #   https://github.com/containers/container-libs/issues/388
          #   https://github.com/coreos/rpm-ostree/issues/5509
          # Same invocation as ublue's image-template. cosign already warns that
          # --new-bundle-format is deprecated and the new format "will be the only
          # supported format in future versions", so this needs revisiting when the
          # verifiers catch up; until then a cosign bump could silently produce
          # signatures the installed system cannot check.
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Attach the package manifest to the pushed image as an OCI referrer so the next
      # build can diff against it without pulling the whole image. Same mechanism ublue
      # uses for its SBOM, but the payload is a ~200 KB package list instead of a 190 MB
      # syft scan: bazzite:stable's SBOM measures 198,515,288 bytes because syft hashes
      # every file in the image, while the only fields a changelog reads are name, version
      # and sourceRpm. It also avoids syft's cost entirely - they must `podman export` the
      # whole rootfs and untar it before scanning.
      #
      # Verified against a local registry using cosign v3.1.2, the version this pipeline
      # pins: signing, then attaching a referrer of this artifactType, leaves
      # `cosign verify --key` passing. So this does not repeat the referrers-fallback
      # breakage that attest-build-provenance's push-to-registry: true caused, where a
      # keyless sigstore bundle in the fallback index made cosign refuse the whole
      # verification with "expected key signature, not certificate".
      - name: Install ORAS
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Attach package manifest
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # oras keeps its own credential store, so podman-login above does not cover it.
          printf '%s' "${GH_TOKEN}" \
            | oras login "${IMAGE_REGISTRY%%/*}" -u "${ACTOR}" --password-stdin
          oras attach \
            --artifact-type application/vnd.vespera.packages.v1+json \
            --annotation filename=packages.json \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            packages.json:application/json

      - name: Attest provenance
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # MUST stay false, which is also the default. With push-to-registry: true this
          # action publishes the provenance bundle into the registry's OCI referrers
          # fallback index — a bare `sha256-<digest>` tag holding an
          # application/vnd.dev.sigstore.bundle.v0.3+json entry. That bundle is keyless
          # (GitHub OIDC -> Fulcio certificate), so referrers-aware cosign enumerates it
          # alongside our real signature and then refuses the whole verification:
          #   Error: no matching attestations: expected key signature, not certificate
          # which breaks `just verify` and `cosign verify --key cosign.pub` even though the
          # cosign signature itself is valid (confirmed independently with
          # `openssl dgst -verify` against the simple-signing payload).
          #
          # The attestation is not lost: it stays in GitHub's attestation store and is
          # verified with `gh attestation verify --owner <owner> oci://<image>`. Only its
          # registry copy is dropped. ublue's image-template attaches no attestation at
          # all, so it never hit this.
          push-to-registry: false


  # Per-release package changelog, published as a GitHub Release. Separate job because it
  # needs `contents: write` and a deep checkout, neither of which the build job should
  # hold. ublue does the same thing in a separate generate_release workflow.
  release:
    name: Generate release
    needs: build
    # Three conditions, all necessary. Not on pull requests, because nothing is published.
    # Only when the no-op gate actually published, otherwise a skipped day would produce an
    # empty release for an image that never moved. And only on the default branch, because
    # a branch build publishes just its branch tag - no dated tag exists to diff against.
    if: >-
      github.event_name != 'pull_request'
      && needs.build.outputs.changed == 'true'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Reading the attached manifest works anonymously while the package is public, but
      # relying on that would break silently the moment it is not.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit table is `git log <prev-revision>..<curr-revision>`, so both
          # revisions must be in this clone. ublue uses 500 for the same reason; the
          # default depth of 1 would make that section silently empty.
          fetch-depth: 500

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR with ORAS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" \
            | oras login "${IMAGE_REGISTRY%%/*}" -u "${ACTOR}" --password-stdin

      - name: Generate release notes
        id: notes
        env:
          # IMAGE_REGISTRY and IMAGE_NAME come from the workflow-level env, which every job
          # inherits; the script reads both from the environment.
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/changelog.py "${VERSION}" ./output.env ./changelog.md --workdir .
          # TITLE and TAG come back through a file rather than stdout so the script can
          # print the whole body to the log without polluting the outputs.
          source ./output.env
          echo "title=${TITLE}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ steps.notes.outputs.title }}
          tag_name: ${{ steps.notes.outputs.tag }}
          body_path: ./changelog.md
          make_latest: true
