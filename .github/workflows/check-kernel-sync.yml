---
name: Check base/akmods kernel sync
on:
  pull_request:
    branches: [main]
    paths: ['Containerfile']

# Fast, cheap pre-check for PRs that touch Containerfile — in practice almost always a
# Renovate digest bump on BASE_TAG, now that AKMODS_TAG is a floating tag Renovate no
# longer tracks (see .github/renovate.json5). Skips the ~20+ minute full image build
# just to answer one question: does akmods currently have a build available for the
# same kernel this PR's proposed base image runs?
#
# WHY THIS EXISTS: build.yml's "Resolve matching akmods digest" step performs the real,
# authoritative check at build time — this job exists only to give a PR fast feedback
# before it merges, instead of waiting for the full build to fail on the same mismatch.
# It does not change what merges: build.yml still fails closed on a real mismatch
# regardless of what this job reports, since akmods can (and does) publish a new,
# matching build in the time between this check and the next real build.
#
# HOW: ghcr.io/ublue-os/kinoite-main, akmods and akmods-nvidia-open all stamp an
# `ostree.linux` config label with the exact kernel-core version they ship or were built
# against. Reading that label via `skopeo inspect --config` needs no image pull.
#
# Only runs on PRs that touch Containerfile. Scheduled daily builds, ordinary pushes,
# and PRs that do not touch Containerfile never trigger this at all.

permissions: {}

jobs:
  check:
    name: Compare kernel versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Read refs from Containerfile
        id: tags
        run: |
          base_tag="$(grep -oP '^ARG BASE_TAG="\K[^"]+' Containerfile)"
          akmods_tag="$(grep -oP '^ARG AKMODS_TAG="\K[^"]+' Containerfile)"
          akmods_nvidia_tag="$(grep -oP '^ARG AKMODS_NVIDIA_TAG="\K[^"]+' Containerfile)"
          akmods_flavor="$(grep -oP '^ARG AKMODS_FLAVOR="\K[^"]+' Containerfile)"
          base_image="$(grep -oP '^ARG BASE_IMAGE="\K[^"]+' Containerfile)"
          akmods_image="$(grep -oP '^ARG AKMODS_IMAGE="\K[^"]+' Containerfile)"
          akmods_nvidia_image="$(grep -oP '^ARG AKMODS_NVIDIA_IMAGE="\K[^"]+' Containerfile)"

          # BASE_TAG is pinned as tag@sha256:digest. skopeo will not take a ref with
          # both a tag and a digest, so use the digest alone, it is the authoritative
          # part of the pin anyway.
          base_digest="${base_tag##*@}"

          # The authoritative build derives a retained kernel-specific tag from the
          # flavor and the base's own labels. AKMODS_TAG is only a local-build default.
          echo "base_ref=${base_image}@${base_digest}" >> "${GITHUB_OUTPUT}"
          echo "akmods_image=${akmods_image}" >> "${GITHUB_OUTPUT}"
          echo "akmods_nvidia_image=${akmods_nvidia_image}" >> "${GITHUB_OUTPUT}"
          echo "akmods_tag=${akmods_tag}" >> "${GITHUB_OUTPUT}"
          echo "akmods_nvidia_tag=${akmods_nvidia_tag}" >> "${GITHUB_OUTPUT}"
          echo "akmods_flavor=${akmods_flavor}" >> "${GITHUB_OUTPUT}"

      - name: Compare kernel versions
        env:
          BASE_REF: ${{ steps.tags.outputs.base_ref }}
          AKMODS_IMAGE: ${{ steps.tags.outputs.akmods_image }}
          AKMODS_NVIDIA_IMAGE: ${{ steps.tags.outputs.akmods_nvidia_image }}
          AKMODS_TAG: ${{ steps.tags.outputs.akmods_tag }}
          AKMODS_NVIDIA_TAG: ${{ steps.tags.outputs.akmods_nvidia_tag }}
          AKMODS_FLAVOR: ${{ steps.tags.outputs.akmods_flavor }}
        run: |
          set -euo pipefail

          echo "Base image ref (proposed by this PR): ${BASE_REF}"
          echo "Akmods flavor                       : ${AKMODS_FLAVOR}"

          base_config="$(skopeo inspect --config "docker://${BASE_REF}")"
          base_kver="$(python3 .github/scripts/read-ostree-linux-label.py <<<"${base_config}")"
          if [[ -z "${base_kver}" || "${base_kver}" != *.* ]]; then
            echo "::warning::Could not read a VERSION-RELEASE.ARCH ostree.linux" \
              "label from ${BASE_REF}. The full build will verify it."
            exit 0
          fi

          if [[ "${AKMODS_TAG}" == *@* || "${AKMODS_NVIDIA_TAG}" == *@* ]]; then
            echo "::warning::AKMODS_TAG and AKMODS_NVIDIA_TAG must be bare flavor/Fedora" \
              "tags. The full build will reject this configuration."
            exit 0
          fi

          if ! candidate_tag="$(
            python3 .github/scripts/resolve_akmods_candidate.py \
              "${AKMODS_FLAVOR}" <<<"${base_config}"
          )"; then
            echo "::warning::Could not derive the akmods tag from ${BASE_REF}." \
              "The full build will fail closed."
            exit 0
          fi
          echo "Base image kernel                    : ${base_kver}"

          # akmods and akmods-nvidia-open use the same retained-tag scheme.
          for image in "${AKMODS_IMAGE}" "${AKMODS_NVIDIA_IMAGE}"; do
            candidate_ref="${image}:${candidate_tag}"
            echo "Akmods candidate ref                 : ${candidate_ref}"

            if ! akmods_kver="$(
              skopeo inspect --config "docker://${candidate_ref}" 2>/dev/null \
                | python3 .github/scripts/read-ostree-linux-label.py
            )"; then
              echo "::warning::No readable kernel-specific akmods image exists for" \
                "${base_kver}. The full build will fail closed until uBlue publishes" \
                "${candidate_ref}."
              continue
            fi

            echo "Akmods candidate kernel              : ${akmods_kver}"

            if [[ "${base_kver}" != "${akmods_kver}" ]]; then
              echo "::warning::Kernel mismatch. Base ${BASE_REF} ships ${base_kver}," \
                "but ${candidate_ref} reports ${akmods_kver}. The full build will" \
                "fail closed."
              continue
            fi

            echo "Kernel-specific akmods candidate matches (${base_kver})."
          done
