---
name: Check base/akmods kernel sync
on:
  pull_request:
    branches: [main]
    paths: ['Containerfile']

# Fast, cheap pre-check for PRs that touch Containerfile — in practice almost always a
# Renovate digest bump on BASE_TAG, now that AKMODS_TAG is a floating tag Renovate no
# longer tracks (see .github/renovate.json5). Skips the ~20+ minute full image build
# just to answer one question: does akmods currently have a build available for the
# same kernel this PR's proposed base image runs?
#
# WHY THIS EXISTS: build.yml's "Resolve matching akmods digest" step performs the real,
# authoritative check at build time — this job exists only to give a PR fast feedback
# before it merges, instead of waiting for the full build to fail on the same mismatch.
# It does not change what merges: build.yml still fails closed on a real mismatch
# regardless of what this job reports, since akmods can (and does) publish a new,
# matching build in the time between this check and the next real build.
#
# HOW: both ghcr.io/ublue-os/kinoite-nvidia and ghcr.io/ublue-os/akmods stamp an
# `ostree.linux` config label with the exact kernel-core version they ship or were built
# against. Reading that label via `skopeo inspect --config` needs no image pull.
#
# Only runs on PRs that touch Containerfile. Scheduled daily builds, ordinary pushes,
# and PRs that do not touch Containerfile never trigger this at all.

permissions: {}

jobs:
  check:
    name: Compare kernel versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Read refs from Containerfile
        id: tags
        run: |
          base_tag="$(grep -oP '^ARG BASE_TAG="\K[^"]+' Containerfile)"
          akmods_tag="$(grep -oP '^ARG AKMODS_TAG="\K[^"]+' Containerfile)"
          base_image="$(grep -oP '^ARG BASE_IMAGE="\K[^"]+' Containerfile)"
          akmods_image="$(grep -oP '^ARG AKMODS_IMAGE="\K[^"]+' Containerfile)"

          # BASE_TAG is pinned as tag@sha256:digest. skopeo will not take a ref with
          # both a tag and a digest, so use the digest alone, it is the authoritative
          # part of the pin anyway.
          base_digest="${base_tag##*@}"

          # AKMODS_TAG is a bare floating tag (e.g. main-44) with no digest to strip —
          # this job checks against whatever akmods currently resolves to right now,
          # which is exactly what build.yml will also resolve against at build time.
          echo "base_ref=${base_image}@${base_digest}" >> "${GITHUB_OUTPUT}"
          echo "akmods_ref=${akmods_image}:${akmods_tag}" >> "${GITHUB_OUTPUT}"

      - name: Compare kernel versions
        env:
          BASE_REF: ${{ steps.tags.outputs.base_ref }}
          AKMODS_REF: ${{ steps.tags.outputs.akmods_ref }}
        run: |
          set -euo pipefail

          echo "Base image ref (proposed by this PR): ${BASE_REF}"
          echo "Akmods floating ref (current)        : ${AKMODS_REF}"

          # Both images stamp the kernel they run/were built against in the
          # ostree.linux config label. Reading it needs only the config blob, not
          # the image itself.
          base_kver="$(
            skopeo inspect --config "docker://${BASE_REF}" \
              | python3 .github/scripts/read-ostree-linux-label.py
          )"
          akmods_kver="$(
            skopeo inspect --config "docker://${AKMODS_REF}" \
              | python3 .github/scripts/read-ostree-linux-label.py
          )"

          echo "base image kernel  : ${base_kver:-<ostree.linux label not found>}"
          echo "akmods image kernel: ${akmods_kver:-<ostree.linux label not found>}"

          if [[ -z "${base_kver}" || -z "${akmods_kver}" ]]; then
            echo "::warning::Could not read ostree.linux from one or both images." \
              "Falling back to the full build to verify."
            exit 0
          fi

          if [[ "${base_kver}" != "${akmods_kver}" ]]; then
            echo "::warning::Kernel mismatch right now. Base image (${BASE_REF})" \
              "ships kernel ${base_kver}, but ${AKMODS_REF} currently resolves to a" \
              "build for kernel ${akmods_kver}. This is a WARNING, not a failure:" \
              "akmods republishes roughly daily and may catch up before this PR's" \
              "own build.yml run — that run performs the authoritative check and" \
              "fails closed if the mismatch still holds then. If this PR's build" \
              "does fail on the same mismatch, wait for akmods's next publish and" \
              "re-run rather than editing AKMODS_TAG — it is no longer pinned."
            exit 0
          fi

          echo "Kernel versions match right now (${base_kver})."
