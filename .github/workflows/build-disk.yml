---
name: Build disk images
on:
  workflow_dispatch:
    inputs:
      target:
        description: Artifact to build
        required: true
        default: iso
        type: choice
        options: [iso, qcow2, raw]
      tag:
        description: Image tag to build the artifact from
        required: true
        default: latest
        type: string
  # Monthly: a reasonably fresh ISO without burning runner minutes on every push.
  schedule:
    - cron: '40 6 1 * *'

env:
  IMAGE_NAME: vespera
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # osbuild's is the maintained one. quay.io/centos-bootc/bootc-image-builder is
  # ARCHIVED — its last build targets Fedora 42 and cannot lay out an F44 image.
  BIB_IMAGE: ghcr.io/osbuild/bootc-image-builder:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'iso' }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-disk:
    name: ${{ inputs.target || 'iso' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@517622d6452028f266b7ba4cc9a123b5f58a6b53 # v9
        with:
          remove-codeql: true

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@25e05be4948f77746938687877829d15c5038036
        continue-on-error: true
        with:
          mount-opts: compress-force=zstd:2

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: inputs
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target || 'iso' }}"
          TAG="${{ inputs.tag || 'latest' }}"
          case "${TARGET}" in
            iso)   TYPE=anaconda-iso; CONFIG=disk_config/iso-kde.toml ;;
            qcow2) TYPE=qcow2;        CONFIG=disk_config/disk.toml ;;
            raw)   TYPE=raw;          CONFIG=disk_config/disk.toml ;;
            *) echo "unknown target ${TARGET}" >&2; exit 1 ;;
          esac
          {
            echo "type=${TYPE}"
            echo "config=${CONFIG}"
            echo "tag=${TAG}"
          } >>"$GITHUB_OUTPUT"
          echo "Building ${TYPE} from ${TAG} using ${CONFIG}"

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      # Signed images only: an installer built from an unverified image hands out
      # media that installs unverified content.
      - name: Verify image signature
        run: |
          set -euo pipefail
          cosign verify \
            --key cosign.pub \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ steps.inputs.outputs.tag }}"

      - name: Pull image
        run: |
          set -euo pipefail
          podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ steps.inputs.outputs.tag }}"

      - name: Build artifact
        run: |
          set -euo pipefail
          mkdir -p output
          # --privileged: needs loop devices and mount(2).
          # --local: use local podman storage, so the digest verified above is what
          #          actually gets installed.
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "${PWD}/output:/output" \
            -v "${PWD}/${{ steps.inputs.outputs.config }}:/config.toml:ro" \
            "${BIB_IMAGE}" \
            --type "${{ steps.inputs.outputs.type }}" \
            --use-librepo=True \
            --local \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ steps.inputs.outputs.tag }}"
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Rename and checksum
        id: artifact
        run: |
          set -euo pipefail
          NAME="${IMAGE_NAME}-${{ steps.inputs.outputs.tag }}"
          find output -type f \( -name '*.iso' -o -name '*.qcow2' -o -name '*.raw' \) \
            -print0 | while IFS= read -r -d '' f; do
              ext="${f##*.}"
              mv "$f" "output/${NAME}.${ext}"
            done
          cd output
          find . -maxdepth 1 -type f ! -name '*.sha256' -exec sha256sum {} + >"${NAME}.sha256"
          ls -lh
          echo "name=${NAME}" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}-${{ inputs.target || 'iso' }}
          path: |
            output/*.iso
            output/*.qcow2
            output/*.raw
            output/*.sha256
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
