# PROVENANCE: Bazzite, verbatim — desktop/shared/etc/systemd/system.conf.d/
#   timeout.conf
#
# Caps the wait for a service to stop before SIGKILL, down from Fedora's 45s. Makes
# reboot-to-apply much faster, which matters on an image-based system.
# libvirt-guests.service is exempt (TimeoutStopSec=0), so VM shutdown is not
# truncated — verified.
[Manager]
DefaultTimeoutStopSec=15s
