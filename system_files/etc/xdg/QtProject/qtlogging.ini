# PROVENANCE: idea from Bazzite (desktop/kinoite/usr/share/qt{5,6}/qtlogging.ini);
#   location and rules are ours. Bazzite writes the package-owned /usr/share files
#   and suppresses kf.svg.{info,debug,warning}. Ours is BROADER — all KDE Frameworks
#   debug, not just SVG.
#
# /usr/share/qt{5,6}/qtlogging.ini are owned by qt{5,6}-qtbase and are not %config,
# so writing them breaks rpm -V and is reverted on the next qtbase update. Qt applies
# rule sets QtConfigRules (/usr/share/qtN) -> ConfigRules (/etc/xdg, then ~/.config)
# -> EnvironmentRules, later winning. So /etc/xdg overrides without touching the
# package file, and a user can still override this.
#
# The first two rules replicate what qtbase ships, so enabling this never loses a
# default the base had.
[Rules]
*.debug=false
qt.qpa.xcb.xcberror.warning=false
qt.qpa.*=false
kf.*.debug=false
