<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fedora's 40-nonlatin.conf only aliases legacy CJK font names (Kochi Gothic,
  NanumGothic, SimSun, ...) into the generic families. It predates Noto being
  the default CJK font and was never updated for it.

  65-google-noto-sans-cjk-fonts.conf appends Noto Sans CJK JP to sans-serif
  only for lang-qualified queries (sans-serif:lang=ja). A plain unqualified
  sans-serif query (which is what Electron/Chromium and many toolkits issue
  per glyph run, without attaching a lang hint) never reaches it, so any CJK
  text falls through to bare Noto Sans and renders as tofu.

  This adds an unconditional, weak fallback so unqualified sans-serif/serif/
  monospace queries also pick up CJK coverage as a last resort. Weak binding
  means it never overrides a user's or app's own explicit font choice; it
  only fills the gap when nothing else claims the glyph.
-->
<fontconfig>
 <match target="pattern">
  <test name="family"><string>sans-serif</string></test>
  <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK JP</string></edit>
 </match>
 <match target="pattern">
  <test name="family"><string>serif</string></test>
  <edit name="family" mode="append" binding="weak"><string>Noto Serif CJK JP</string></edit>
 </match>
 <match target="pattern">
  <test name="family"><string>monospace</string></test>
  <edit name="family" mode="append" binding="weak"><string>Noto Sans Mono CJK JP</string></edit>
 </match>
</fontconfig>
