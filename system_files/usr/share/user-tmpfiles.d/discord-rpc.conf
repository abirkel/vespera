# PROVENANCE: mechanism from Bazzite (desktop/shared/etc/skel/.config/
#   user-tmpfiles.d/discord-rpc.conf); location and app id changed. Bazzite targets
#   com.discordapp.Discord from /etc/skel, which only reaches new accounts.
#
# Games look for the RPC socket at $XDG_RUNTIME_DIR/discord-ipc-0, but a Flatpak
# client can only create it under $XDG_RUNTIME_DIR/app/<app-id>/. Steam here is
# native and Vesktop is a Flatpak, so without this bridge Rich Presence, "Now
# Playing" and game invites silently do nothing.
#
# /usr/share/user-tmpfiles.d is the system-wide search path for
# `systemd-tmpfiles --user`, so this applies to every account.
# `L` only creates the link if nothing is there, so a real socket is never clobbered.
L %t/discord-ipc-0 - - - - app/dev.vencord.Vesktop/discord-ipc-0
