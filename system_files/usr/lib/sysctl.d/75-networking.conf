# PROVENANCE: Bazzite, verbatim (all four) — desktop/shared/usr/lib/sysctl.d/
#   75-networking.conf
#
# BBR beats cubic on lossy or high-latency links; Fedora's default is cubic
# (CONFIG_DEFAULT_TCP_CONG="cubic", verified). tcp_bbr is a module, but no
# modules-load.d entry is needed: the sysctl handler calls tcp_ca_find_autoload(),
# which request_module()s "tcp_bbr" on write. Bazzite relies on the same thing.
net.ipv4.tcp_congestion_control=bbr

# Recover from a broken-PMTU path instead of stalling.
net.ipv4.tcp_mtu_probing=1

# Prefer rotating temporary IPv6 addresses, so the interface identifier is not a
# permanent tracking handle.
net.ipv6.conf.all.use_tempaddr=2
net.ipv6.conf.default.use_tempaddr=2
