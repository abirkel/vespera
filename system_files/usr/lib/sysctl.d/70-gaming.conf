# PROVENANCE: max_map_count from Bazzite, verbatim — desktop/shared/usr/lib/sysctl.d/
#   70-gaming.conf. page-cluster is also Bazzite's desktop value, but they set it via
#   their own tuned profiles (balanced-bazzite, throughput-performance-bazzite); this
#   image ships no tuned profile, so sysctl.d is the equivalent place. Verified that no
#   installed tuned profile touches it, so there is nothing to conflict with.
#
# Overrides Fedora's 10-map-count.conf (1048576); 70 sorts after 10. Star Citizen,
# Hogwarts Legacy and some Unreal 5 titles exhaust 1 M mappings and crash with an
# allocation failure that names no cause. 2147483642 is what Valve asks for.
vm.max_map_count=2147483642

# zram has no seek cost, so the default 8-page readahead is wasted decompression.
vm.page-cluster=0
