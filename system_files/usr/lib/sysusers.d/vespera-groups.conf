# PROVENANCE: Bazzite, verbatim — desktop/shared/usr/lib/sysusers.d/plugdev.conf
#   pins the same GID 46.
#
# plugdev is not created by any Fedora package, but base udev rules grant to it:
# Switch controllers (10-switch.rules), Logitech Unifying
# (42-logitech-unify-permissions.rules — what ratbagd, and so Piper, talks to),
# ZSA keyboards (50-zsa.rules) and U2F keys (70-u2f.rules).
#
# 46 is Debian's conventional GID and is unassigned on Fedora (verified). Pinning
# avoids sysusers allocating a different GID in a later build, which would orphan
# anything already chgrp'd to the old one.
#
# Only plugdev belongs here. Two groups were considered and deliberately left out,
# because the package that needs them now declares them itself:
#   usershares  samba-usershares ships `g usershares -`. Redeclaring it with a pinned
#               GID collided with dockerroot (986) and sysusers silently fell back to a
#               dynamic GID anyway, so the pin bought nothing but the collision.
#   yeetmouse   the yeetmouse RPM ships /usr/lib/sysusers.d/yeetmouse.conf as of
#               yeetmouse-0-2. It used to create no group at all, which killed
#               yeetmouse.service on every boot with "chown: invalid group" — fixed
#               upstream in abirkel/yeetmouse-rpm rather than patched around here.
#
# Group MEMBERSHIP for both lives in system-setup.hooks.d/10-groups.sh: an RPM cannot
# know which users should be in a group, so that half is ours regardless.
g plugdev 46
