# PROVENANCE: Bazzite does the same thing in desktop/shared/usr/share/ublue-os/just/
#   84-bazzite-virt.just ("Making sure swtpm will work": mkdir /var/lib/swtpm-localca +
#   chown tss). Declarative here, and every boot, rather than in a ujust recipe.
#
# swtpm_localca stores its CA state here. The swtpm-tools RPM owns the path, but /var is
# empty on first boot, so it has to be recreated.
#
# tss:root mode 0750 — taken from the RPM's own file ownership, not tss:tss. The wrong
# group breaks swtpm_localca's ability to write.
d /var/lib/swtpm-localca 0750 tss root - -
