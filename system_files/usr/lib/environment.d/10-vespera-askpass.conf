# PROVENANCE: Bazzite sets this, in etc/profile.d/askpass.sh (desktop/shared). The
#   mechanism is changed here; the reason is NOT the one an earlier version of this file
#   gave.
#
# Nothing in the base sets SUDO_ASKPASS, so `sudo -A` fails despite ksshaskpass being
# installed. That part is real.
#
# CORRECTION: profile.d would in fact work for both shells. Fedora's /etc/bashrc loops
# /etc/profile.d/*.sh, and so does /etc/zshrc via its _src_etc_profile_d helper —
# empirically confirmed for `zsh -ic` and `zsh -lic`. An earlier note here claimed zsh
# never gets profile.d, which was wrong.
#
# environment.d is still the better home, for a different reason: it is read by
# `systemd --user` (the generator 30-systemd-environment-d-generator is present), so the
# variable reaches the Plasma session and every GUI process launched from it — not just
# processes that happen to have gone through a shell rc. It also does not depend on an
# account having been provisioned with a shell rc that sources profile.d.
#
# The format cannot express a conditional, so 99-cleanup.sh asserts the target exists.
SUDO_ASKPASS=/usr/bin/ksshaskpass
