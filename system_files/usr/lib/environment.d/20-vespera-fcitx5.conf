# PROVENANCE: ours.
#
# fcitx5-autostart (installed in 10-packages-fedora.sh) already ships its own
# /etc/profile.d script setting these same variables. This file is redundant with
# it by design, not a replacement for it: environment.d is read by `systemd --user`
# (see usr/lib/environment.d/10-vespera-askpass.conf for the same reasoning), which
# reaches every GUI process launched in the Plasma session, whereas profile.d only
# fires for processes that went through a shell that sources it. Keeping both means
# the toolkit variables are set even if something ever starts a GUI app outside a
# login shell.
#
# GTK_IM_MODULE is included even though this image's default apps are Qt/KDE, so a
# GTK app (Electron apps route through their own IME path, but a GTK3/4 native app
# would use this) gets fcitx5 too rather than silently having no IME.
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
