# PROVENANCE: ours.
#
# Fedora Atomic Desktops (Kinoite/Silverblue) stopped regenerating grub.cfg
# with grub2-mkconfig starting Fedora 41 -- it's a static config now, shipped
# by the image/deployment. Composefs (default for bootc images, and for
# Atomic Desktops generally from Fedora 42) breaks grub2-mkconfig outright:
# grub2-probe cannot resolve a canonical path through it
# (https://github.com/ostreedev/ostree/issues/3198, open, unfixed since
# Feb 2024). Editing grub.cfg directly doesn't survive regeneration either.
#
# user.cfg is the static config's own sourced override file for exactly this
# -- confirmed directly by Timothée Ravier (a Fedora developer who owns the
# composefs Change Proposal) on Fedora Discussion:
# https://discussion.fedoraproject.org/t/etc-default-grub-is-missing-on-silverblue-41-fresh-install/135344/3
# It's read by the static grub.cfg without ever invoking grub2-probe, so it
# isn't affected by the composefs bug above.
#
# Without this, this image's own baked-in timeout is 1 second -- long enough
# to satisfy "menu style, not hidden" but too short to see or interact with,
# which is what made a two-deployment dual-boot machine look like it had no
# boot menu at all. GRUB_DEFAULT and kernel arguments are NOT covered by
# user.cfg; those go through `rpm-ostree kargs` (a genuinely separate
# mechanism), not this file.
set timeout=3
set timeout_style=menu
